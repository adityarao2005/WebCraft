# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        types: [review_requested, ready_for_review]
    issue_comment:
        types: [created]

# Building PR code only needs read access. Status-writing jobs never check it out.
permissions:
    contents: read

jobs:
    prepare:
        if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(github.event.comment.body, '!build'))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
            statuses: write
        outputs:
            run: ${{ steps.request.outputs.run }}
            sha: ${{ steps.request.outputs.sha }}
        steps:
            - name: Authorize build request and resolve PR commit
              id: request
              uses: actions/github-script@v9
              with:
                  script: |
                      core.setOutput('run', 'false');
                      if (context.eventName !== 'issue_comment') {
                          core.setOutput('run', 'true');
                          return;
                      }
                      if (context.payload.comment.body.trim() !== '!build') return;

                      let permission;
                      try {
                          ({ data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                              ...context.repo,
                              username: context.payload.comment.user.login
                          }));
                      } catch (error) {
                          if (error.status !== 404) throw error;
                          core.notice('Ignoring !build from a user without repository write access.');
                          return;
                      }
                      if (!['admin', 'maintain', 'write'].includes(permission.permission)) {
                          core.notice('Ignoring !build from a user without repository write access.');
                          return;
                      }

                      const { data: pull } = await github.rest.pulls.get({
                          ...context.repo,
                          pull_number: context.issue.number
                      });
                      if (pull.state !== 'open' || pull.base.ref !== 'main') {
                          core.notice('!build requires an open PR targeting main.');
                          return;
                      }
                      await github.rest.repos.createCommitStatus({
                          ...context.repo,
                          sha: pull.head.sha,
                          state: 'pending',
                          context: 'WebCraft / requested build',
                          description: 'Requested build is running',
                          target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                      });
                      core.setOutput('sha', pull.head.sha);
                      core.setOutput('run', 'true');

    build:
        needs: prepare
        if: needs.prepare.outputs.run == 'true'
        runs-on: ${{ matrix.os }}

        strategy:
            # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
            fail-fast: false

            # Windows matches the VS 2022 preset; macOS includes debug symbols.
            # Linux and Windows use Release, while macOS uses Debug for diagnostics.
            matrix:
                os: [ubuntu-latest, windows-2022]
                build_type: [Release]
                c_compiler: [gcc, clang, cl]
                include:
                    - os: windows-2022
                      c_compiler: cl
                      cpp_compiler: cl
                      preset: windows-build
                      name: Release/WebCraft.exe
                    - os: ubuntu-latest
                      c_compiler: gcc
                      cpp_compiler: g++
                      preset: linux-build
                      name: WebCraft
                    - os: ubuntu-latest
                      c_compiler: clang
                      cpp_compiler: clang++
                      preset: linux-build
                      name: WebCraft
                    - os: macos-latest
                      build_type: Debug
                      c_compiler: clang
                      cpp_compiler: clang++
                      preset: macos-build
                      name: WebCraft
                exclude:
                    - os: windows-2022
                      c_compiler: gcc
                    - os: windows-2022
                      c_compiler: clang
                    - os: ubuntu-latest
                      c_compiler: cl
                    - os: macos-latest
                      c_compiler: cl
                    - os: macos-latest
                      c_compiler: gcc

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare.outputs.sha }}
                  persist-credentials: false
                  submodules: "recursive"

            - name: Set reusable strings
              # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
              id: strings
              shell: bash
              run: |
                  echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

            - name: Get Version of Compiler which is not Windows
              if: ${{ matrix.os != 'windows-2022' }}
              run: |
                  echo "C Compiler: ${{ matrix.c_compiler }}"
                  echo "C++ Compiler: ${{ matrix.cpp_compiler }}"

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.x'

            - name: Check Python build tooling
              run: python -m unittest discover -s scripts/tests -v

            - name: Configure CMake
              run: >
                  python scripts/webcraft.py configure
                  --preset ${{ matrix.preset }}
                  --build-dir "${{ steps.strings.outputs.build-output-dir }}"
                  --cxx-compiler ${{ matrix.cpp_compiler }}
                  --config ${{ matrix.build_type }}

            - name: Build
              run: >
                  python scripts/webcraft.py build
                  --build-dir "${{ steps.strings.outputs.build-output-dir }}"
                  --config ${{ matrix.build_type }}

            - name: Generate macOS debug symbols
              if: ${{ runner.os == 'macOS' }}
              run: dsymutil "${{ steps.strings.outputs.build-output-dir }}/tests/webcraft_tests"

            - name: Test
              id: tests
              run: >
                  python scripts/webcraft.py test
                  --build-dir "${{ steps.strings.outputs.build-output-dir }}"
                  --config ${{ matrix.build_type }}

            - name: Supported sanitizer checks
              if: runner.os == 'Linux' && matrix.c_compiler == 'clang'
              env:
                  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
                  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
              run: >
                  python scripts/webcraft.py check
                  --build-dir build-sanitizers --config RelWithDebInfo
                  --cxx-compiler clang++ --sanitizer address-undefined

            - name: Upload test and build diagnostics
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-diagnostics-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ github.run_attempt }}
                  retention-days: 7
                  if-no-files-found: warn
                  path: |
                      build/webcraft.log
                      build/test-results.xml
                      build/Testing/Temporary/
                      build-sanitizers/webcraft.log
                      build-sanitizers/test-results.xml
                      build-sanitizers/Testing/Temporary/

            - name: Diagnose macOS file adaptor timeout
              if: failure() && runner.os == 'macOS' && steps.tests.outcome == 'failure'
              timeout-minutes: 2
              run: >
                  python3 .github/scripts/diagnose_macos_test.py
                  "${{ steps.strings.outputs.build-output-dir }}/tests/webcraft_tests"
                  "${{ steps.strings.outputs.build-output-dir }}/diagnostics"

            - name: Upload macOS failure diagnostics
              if: failure() && runner.os == 'macOS'
              uses: actions/upload-artifact@v7
              with:
                  name: macos-file-io-diagnostics-${{ github.run_attempt }}
                  retention-days: 7
                  if-no-files-found: warn
                  path: |
                      build/Testing/Temporary/
                      build/diagnostics/
                      build/tests/webcraft_tests
                      build/tests/webcraft_tests.dSYM/

    report:
        needs: [prepare, build]
        if: always() && github.event_name == 'issue_comment' && needs.prepare.outputs.run == 'true'
        runs-on: ubuntu-latest
        permissions:
            statuses: write
        steps:
            - name: Report matrix result on the tested PR commit
              uses: actions/github-script@v9
              env:
                  BUILD_SHA: ${{ needs.prepare.outputs.sha }}
                  BUILD_RESULT: ${{ needs.build.result }}
              with:
                  script: |
                      const result = process.env.BUILD_RESULT;
                      const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error';
                      await github.rest.repos.createCommitStatus({
                          ...context.repo,
                          sha: process.env.BUILD_SHA,
                          state,
                          context: 'WebCraft / requested build',
                          description: `Requested build: ${result}`,
                          target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                      });
