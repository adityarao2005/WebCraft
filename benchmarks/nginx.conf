# ---------------------------------------------------------------------------
# nginx.conf — Minimal Nginx configuration for benchmarking.
#
# Usage:
#   nginx -c /absolute/path/to/this/nginx.conf
#
# This config runs Nginx in the foreground with a single worker process
# and serves a fixed inline "Hello, World!" response — no disk I/O, no
# proxy, no logging.
# ---------------------------------------------------------------------------

# Run in foreground (required for the benchmark script to manage the process)
daemon off;

# Single worker for fair single-process comparison.
# Increase this to match the number of CPUs for a multi-worker comparison.
worker_processes 1;

# Suppress error log noise during benchmarks
error_log /dev/null crit;

# PID file — use a temp path so we don't need root
pid /tmp/nginx_bench.pid;

events {
    worker_connections 4096;
}

http {
    # Disable access logging entirely for maximum throughput
    access_log off;

    # Keep-alive settings
    keepalive_timeout 65;
    keepalive_requests 10000;

    # TCP optimisations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    server {
        # Default benchmark port for Nginx
        listen 8082 reuseport;
        server_name _;

        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>\n<html><head><title>Nginx Benchmark</title></head>\n<body><h1>Hello, World!</h1></body></html>\n';
        }
    }
}
